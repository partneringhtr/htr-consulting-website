<style>
  :root {
    --black: #0a0a0a;
    --dark: #111111;
    --dark2: #1a1a1a;
    --dark3: #222222;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.04);
    --red: #C0392B;
    --red2: #e04030;
    --gold: #C9A84C;
    --gold2: rgba(201,168,76,0.15);
    --white: #ffffff;
    --white70: rgba(255,255,255,0.7);
    --white40: rgba(255,255,255,0.4);
    --white15: rgba(255,255,255,0.08);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--black);
    color: var(--white);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    line-height: 1.7;
    overflow-x: hidden;
  }
  /* ── NAV ── */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    padding: 0 5%;
    display: flex; align-items: center; justify-content: space-between;
    height: 72px;
    background: rgba(10,10,10,0.85);
    backdrop-filter: blur(20px);
    border-bottom: 0.5px solid var(--border);
    transition: background 0.3s;
  }
  .nav-logo {
    display: flex; align-items: center; gap: 12px;
    text-decoration: none;
  }
  .nav-logo-mark {
    width: 36px; height: 36px;
    background: var(--red);
    display: flex; align-items: center; justify-content: center;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500; font-size: 13px; letter-spacing: 0.5px;
    color: white;
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
  }
  .nav-logo-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px; font-weight: 400; letter-spacing: 2px;
    color: var(--white); text-transform: uppercase;
  }
  .nav-links {
    display: flex; gap: 36px; list-style: none;
  }
  .nav-links a {
    color: rgba(255,255,255,0.65); text-decoration: none;
    font-size: 12px; letter-spacing: 2px; text-transform: uppercase;
    transition: color 0.2s;
  }
  .nav-links a:hover { color: var(--white); }
  /* ── HERO ── */
  #home {
    min-height: 88vh;
    display: flex; flex-direction: column; justify-content: center;
    padding: 72px 5% 6%;
    position: relative;
    overflow: hidden;
    background: var(--black);
  }
  .hero-bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 70% 40%, rgba(192,57,43,0.12) 0%, transparent 60%),
      radial-gradient(ellipse 60% 80% at 20% 80%, rgba(201,168,76,0.06) 0%, transparent 50%),
      linear-gradient(160deg, #0a0a0a 0%, #111111 50%, #0d0d0d 100%);
  }
  .hero-grid {
    position: absolute; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 80px 80px;
    mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.5) 30%, rgba(0,0,0,0.5) 70%, transparent 100%);
  }
  .hero-eyebrow {
    font-size: 11px; letter-spacing: 4px; text-transform: uppercase;
    color: var(--gold); margin-bottom: 24px;
    display: flex; align-items: center; gap: 16px;
  }
  .hero-eyebrow::before {
    content: ''; display: block;
    width: 32px; height: 1px; background: var(--gold);
  }
  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(52px, 8vw, 110px);
    font-weight: 300; line-height: 1.0;
    letter-spacing: -1px;
    color: var(--white);
    margin-bottom: 32px;
  }
  h1 em {
    font-style: italic; color: var(--white70);
  }
  .hero-sub {
    font-size: 15px; color: var(--white40);
    max-width: 480px; line-height: 1.8;
    margin-bottom: 48px;
  }
  .hero-cta {
    display: inline-flex; align-items: center; gap: 12px;
    color: var(--white); text-decoration: none;
    font-size: 12px; letter-spacing: 2px; text-transform: uppercase;
    border-bottom: 1px solid var(--red);
    padding-bottom: 4px;
    transition: gap 0.2s, color 0.2s;
  }
  .hero-cta:hover { gap: 20px; color: var(--red2); }
  .hero-fork {
    display: flex; gap: 16px; flex-wrap: wrap;
    margin-top: 8px;
  }
  .fork-btn {
    display: flex; flex-direction: column; gap: 6px;
    padding: 18px 26px;
    min-width: 220px;
    text-decoration: none;
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.02);
    transition: border-color 0.25s, background 0.25s, transform 0.25s;
  }
  .fork-btn:hover {
    border-color: var(--red);
    background: rgba(255,255,255,0.05);
    transform: translateY(-2px);
  }
  .fork-btn-label {
    color: var(--white);
    font-size: 15px; letter-spacing: 0.3px;
  }
  .fork-btn-sub {
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
    color: rgba(255,255,255,0.45);
    transition: color 0.25s;
  }
  .fork-btn:hover .fork-btn-sub { color: var(--red2); }
  @media (max-width: 700px) {
    .hero-fork { flex-direction: column; gap: 12px; }
    .fork-btn { min-width: 0; width: 100%; }
  }
  .hero-stat-row {
    position: absolute; right: 5%; bottom: 8%;
    display: flex; flex-direction: column; gap: 32px;
    text-align: right;
  }
  .hero-stat-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 42px; font-weight: 300;
    color: var(--white); line-height: 1;
  }
  .hero-stat-label {
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--white40); margin-top: 4px;
  }
  .hero-divider { width: 1px; height: 40px; background: var(--border); align-self: flex-end; }
  /* ── SECTIONS ── */
  section {
    padding: 120px 5%;
  }
  .section-label {
    font-size: 11px; letter-spacing: 4px; text-transform: uppercase;
    color: var(--red); margin-bottom: 16px;
    display: flex; align-items: center; gap: 12px;
  }
  .section-label::after {
    content: ''; flex: 1; max-width: 40px;
    height: 1px; background: var(--red);
  }
  h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(36px, 4vw, 58px);
    font-weight: 300; line-height: 1.15;
    margin-bottom: 32px;
  }
  h3 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 26px; font-weight: 400;
    margin-bottom: 12px;
  }
  /* ── OVERVIEW ── */
  #overview { background: var(--dark); }
  .overview-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 80px; align-items: start;
  }
  .overview-left p { color: var(--white70); font-size: 16px; line-height: 1.9; margin-bottom: 20px; }
  .overview-right {}
  .overview-card {
    border: 0.5px solid var(--border);
    padding: 32px;
    margin-bottom: 16px;
    background: var(--dark2);
    position: relative;
    transition: border-color 0.2s, background 0.2s;
  }
  .overview-card::before {
    content: '';
    position: absolute; top: 0; left: 0;
    width: 3px; height: 100%;
    background: var(--red);
  }
  .overview-card:hover { border-color: rgba(255,255,255,0.15); background: var(--dark3); }
  .overview-card-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 48px; font-weight: 300;
    color: var(--white); line-height: 1;
    margin-bottom: 4px;
  }
  .overview-card-label {
    font-size: 12px; color: var(--white40);
    letter-spacing: 1.5px; text-transform: uppercase;
  }
  .founding-block {
    margin-top: 48px;
    padding: 40px;
    border: 0.5px solid var(--border);
    background: linear-gradient(135deg, var(--dark2), var(--dark));
    position: relative; overflow: hidden;
  }
  .founding-block::after {
    content: '2015';
    position: absolute; right: -10px; top: 50%; transform: translateY(-50%);
    font-family: 'Cormorant Garamond', serif;
    font-size: 120px; font-weight: 300;
    color: rgba(255,255,255,0.03); line-height: 1;
    pointer-events: none;
  }
